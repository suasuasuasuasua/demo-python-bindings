[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "myMathLib"
version = "0.1.0"
description = "A dummy math library with Python bindings via pybind11"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[tool.scikit-build]
build-dir = "build"
cmake.build-type = "Release"
wheel.packages = ["python/myMathLib"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.coverage.run]
source = ["myMathLib"]
branch = true

[tool.coverage.report]
show_missing = true
